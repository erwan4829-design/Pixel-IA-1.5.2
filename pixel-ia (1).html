<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel IA</title>
<style>
:root{--bg:#fff;--fg:#16181d;--mut:#6b7280;--card:#f3f4f8;--bd:#e3e5ec;--ac:#6d5efc;--ac2:#ff5fa2;--sh:rgba(0,0,0,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--fs:16px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--fg:#eceef3;--mut:#9aa1b0;--card:#1a1d25;--bd:#2a2e39;--sh:rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#0f1115;--fg:#eceef3;--mut:#9aa1b0;--card:#1a1d25;--bd:#2a2e39;--sh:rgba(0,0,0,.6)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:var(--fs)/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{height:100%;display:flex;flex-direction:column;max-width:820px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--bd)}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px}
.ico:active{background:var(--card)}
#pill{margin:0 auto;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:7px 14px;font-weight:600;font-size:.9em;display:flex;gap:6px;align-items:center}
#msgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:12px}
.m{max-width:88%;padding:10px 14px;border-radius:18px;word-wrap:break-word;overflow-wrap:anywhere}
.u{align-self:flex-end;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-bottom-right-radius:6px;white-space:pre-wrap}
.a{align-self:flex-start;background:var(--card);border-bottom-left-radius:6px}
.a pre{background:#0d1017;color:#e6e9f2;padding:10px;border-radius:10px;overflow-x:auto;font-size:.85em;margin:8px 0}
.a code{font-family:ui-monospace,Menlo,monospace;background:rgba(127,127,127,.2);padding:1px 5px;border-radius:5px;font-size:.9em}
.a pre code{background:none;padding:0}
.tag{font-size:.72em;color:var(--mut);margin-bottom:3px;font-weight:600}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--mut);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
.hero{margin:auto;text-align:center;padding:20px}
.logo{width:64px;height:64px;border-radius:18px;margin:0 auto 12px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:28px}
.hero h1{margin:0 0 4px;font-size:1.5em}.hero p{margin:0 0 16px;color:var(--mut)}
.chips{display:flex;flex-direction:column;gap:8px}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;text-align:left}
#bar{padding:10px 12px;border-top:1px solid var(--bd);display:flex;gap:8px;align-items:flex-end}
#in{flex:1;resize:none;max-height:140px;min-height:44px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:22px;padding:10px 16px;font:inherit;outline:none}
#send{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:20px}
#send:disabled{opacity:.4}
.ov{position:fixed;inset:0;background:var(--sh);display:none;z-index:20}
.ov.on{display:block}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(82%,320px);background:var(--bg);z-index:30;transform:translateX(-102%);transition:transform .22s;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));border-right:1px solid var(--bd)}
#drawer.on{transform:none}
.btn{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:14px;padding:12px 14px;font-weight:600;width:100%}
.btn2{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;width:100%;text-align:left}
.lbl{font-size:.75em;color:var(--mut);margin:16px 4px 6px;text-transform:uppercase;letter-spacing:.05em}
#hist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.h{display:flex;align-items:center;border-radius:10px}
.h.cur{background:var(--card)}
.h button:first-child{flex:1;text-align:left;padding:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h .x{padding:8px 10px;color:var(--mut)}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:820px;margin:0 auto;background:var(--bg);z-index:40;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .22s;max-height:85%;overflow-y:auto;border:1px solid var(--bd)}
.sheet.on{transform:none}
.sheet h2{margin:0 0 12px;font-size:1.15em}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--bd);background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.opt.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}
.opt b{display:flex;justify-content:space-between;gap:8px}
.opt small{color:var(--mut);display:block;margin-top:2px}
.badge{font-size:.7em;padding:2px 8px;border-radius:10px;background:var(--ac);color:#fff;font-weight:600;white-space:nowrap}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;border:1px solid var(--bd)}
.seg button{padding:6px 11px;border-radius:9px;font-size:.85em}
.seg .on{background:var(--ac);color:#fff}
.note{color:var(--mut);font-size:.85em;margin:10px 0}
.act{display:flex;gap:8px;margin-top:8px}
.act button{font-size:.78em;background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:5px 12px;color:var(--mut)}
.act button.on{color:#fff;background:var(--ac);border-color:var(--ac)}
.ver{font-family:ui-monospace,Menlo,monospace;color:var(--mut)}
.news{padding-left:18px;margin:0}.news li{margin-bottom:10px}
.price{font-size:1.8em;font-weight:800}
.feat{margin:8px 0 12px;padding-left:18px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:.88em;z-index:60;display:none;max-width:90%}
</style></head>
<body>
<div id="app">
 <header>
  <button class="ico" id="burger" aria-label="Menu">☰</button>
  <button id="pill"><span id="pname">Pixel IA 1.2 Flash</span><span>▾</span></button>
  <button class="ico" id="newtop" aria-label="Nouvelle page">✎</button>
 </header>
 <div id="msgs"></div>
 <div id="bar">
  <textarea id="in" rows="1" placeholder="Pose ta question à Pixel IA…" style="height: auto;"></textarea>
  <button id="send" aria-label="Envoyer">➤</button>
 </div>
</div>

<div class="ov" id="ov"></div>
<aside id="drawer" class="">
 <button class="btn" id="new">＋ Nouvelle page</button>
 <div class="lbl">Conversations</div>
 <div id="hist"></div>
 <button class="btn2" id="openset">⚙️ Paramètres</button>
</aside>

<div class="sheet" id="models"><h2>Choisir un modèle</h2><div id="mlist"></div></div>
<div class="sheet" id="set"><h2>Paramètres</h2>
 <div class="row"><span>Thème</span><div class="seg" id="theme"><button data-v="auto" class="">Auto</button><button data-v="light" class="">Clair</button><button data-v="dark" class="">Sombre</button></div></div>
 <div class="row"><span>Taille du texte</span><div class="seg" id="fs"><button data-v="14">A</button><button data-v="16" class="">A+</button><button data-v="19" class="">A++</button></div></div>
 <div class="row"><span>Modèle par défaut</span><button class="badge" id="setmodel">Pixel IA 1.2 Flash</button></div>
 <div class="row"><span>Abonnement</span><b id="planlbl">Premium ✨ · 1,5 To</b></div>
 <div class="row"><span>Vitesse de la voix</span><div class="seg" id="rate"><button data-v="0.9" class="">Lente</button><button data-v="1.05" class="">Normale</button><button data-v="1.25" class="">Rapide</button></div></div>
 <div style="padding-top:10px;display:flex;flex-direction:column;gap:8px">
  <button class="btn" id="premium" style="display: none;">⭐ Acheter Premium – 35,90 €</button>
  <button class="btn2" id="news">🆕 Nouveautés</button>
  <button class="btn2" id="ver">ℹ️ Code de version</button>
  <button class="btn2" id="vt">🔈 Tester la voix</button>
  <button class="btn2" id="dl">⬇️ Télécharger Pixel IA</button>
  <button class="btn2" id="clear">🗑️ Effacer tout l’historique</button>
  <button class="btn2" id="resetq">↺ Réinitialiser les questions gratuites</button>
 </div>
 <p class="note">Pixel IA ne génère pas encore d’images ni de vidéos.</p>
</div>
<div class="sheet" id="lock"><h2>🔒 Limite atteinte</h2><p id="locktxt"></p>
 <button class="btn" id="golock">Voir Premium – 35,90 €</button>
 <button class="btn2" id="closelock" style="margin-top:8px">Rester en gratuit</button>
</div>
<div class="sheet" id="info"><h2 id="ititle"></h2><div id="ibody"></div><button class="btn2" id="iclose" style="margin-top:12px">Fermer</button></div>
<div id="toast">Questions gratuites réinitialisées</div>

<script>
var $=function(i){return document.getElementById(i)};
var MODELS={
 flash:{n:"Pixel IA 1.2 Flash",d:"Réponses très rapides, idéal pour les questions simples",tier:"quick",lim:0,sys:"Tu es Pixel IA 1.2 Flash. Réponds de façon très brève et directe (1 à 3 phrases maximum)."},
 think:{n:"Pixel IA 1.3 Réflexion",d:"Réfléchit plus longtemps, réponses plus construites",tier:"default",lim:5,sys:"Tu es Pixel IA 1.3 Réflexion. Raisonne soigneusement, étape par étape, puis donne une réponse claire et bien construite."},
 pro:{n:"Pixel IA 1.5 Pro",d:"Réfléchit encore plus, réponses ultra construites, très fort en code",tier:"complex",lim:3,sys:"Tu es Pixel IA 1.5 Pro. Donne une réponse approfondie, rigoureuse et très structurée. Tu excelles en programmation : utilise des blocs de code commentés."}
};
var COMMON=" Tu ne peux pas générer d’images ni de vidéos pour l’instant ; si on te le demande, dis que ce n’est pas encore disponible. Réponds dans la langue de l’utilisateur.";
var VER="1.1.0",PAY_URL="",PIXEL_API="",PREM={think:300000,pro:5000};
var S={convs:[],cur:null,model:"flash",plan:"free",used:{think:0,pro:0},tot:{think:0,pro:0},theme:"auto",fs:"16",rate:"1.05"};
try{var r=localStorage.getItem("pixelia");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem("pixelia",JSON.stringify(S))}catch(e){}}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function md(t){
 var parts=t.split("```"),o="";
 for(var i=0;i<parts.length;i++){
  if(i%2){o+="<pre><code>"+esc(parts[i].replace(/^[\w+-]*\n/,""))+"</code></pre>"}
  else{o+=esc(parts[i]).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/^#+\s*(.+)$/gm,"<b>$1</b>").replace(/\n/g,"<br>")}
 }
 return o;
}
function conv(){return S.convs.find(function(c){return c.id===S.cur})}
function toast(t){var e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display="none"},2600)}
function left(k){var m=MODELS[k];if(!m.lim||S.plan==="premium")return null;return Math.max(0,m.lim-S.used[k])}

function applyPrefs(){
 var d=document.documentElement;
 if(S.theme==="auto")d.removeAttribute("data-theme");else d.setAttribute("data-theme",S.theme);
 d.style.setProperty("--fs",S.fs+"px");
 document.querySelectorAll("#theme button").forEach(function(b){b.classList.toggle("on",b.dataset.v===S.theme)});
 document.querySelectorAll("#fs button").forEach(function(b){b.classList.toggle("on",b.dataset.v===S.fs)});
 $("pname").textContent=MODELS[S.model].n;
 $("setmodel").textContent=MODELS[S.model].n;
 $("planlbl").textContent=S.plan==="premium"?"Premium ✨ · 1,5 To":"Gratuit";
 document.querySelectorAll("#rate button").forEach(function(b){b.classList.toggle("on",b.dataset.v===S.rate)});
 $("premium").style.display=S.plan==="premium"?"none":"block";
}
function renderHist(){
 var h=$("hist");h.innerHTML="";
 if(!S.convs.length){h.innerHTML='<p class="note" style="padding:0 6px">Aucune conversation pour l’instant.</p>';return}
 S.convs.forEach(function(c){
  var d=document.createElement("div");d.className="h"+(c.id===S.cur?" cur":"");
  var a=document.createElement("button");a.textContent="💬 "+c.title;a.onclick=function(){S.cur=c.id;save();closeAll();render()};
  var x=document.createElement("button");x.className="x";x.textContent="✕";x.setAttribute("aria-label","Supprimer");
  x.onclick=function(){S.convs=S.convs.filter(function(z){return z.id!==c.id});if(S.cur===c.id)S.cur=null;save();renderHist();render()};
  d.appendChild(a);d.appendChild(x);h.appendChild(d);
 });
}
function bubble(m){
 var d=document.createElement("div");
 if(m.r==="u"){d.className="m u";d.textContent=m.t}
 else{d.className="m a";d.innerHTML='<div class="tag">'+esc(MODELS[m.m||"flash"].n)+'</div><div class="body">'+(m.t?md(m.t):'<span class="dots"><span></span><span></span><span></span></span>')+'</div>'}
 if(m.r==="a"&&m.t){var a=document.createElement("div");a.className="act";
  var b=document.createElement("button");b.className="lis"+(speaking===m?" on":"");b.textContent=speaking===m?"⏹ Arrêter":"🔊 Écouter";b.onclick=function(){listen2(m,b)};
  var cp=document.createElement("button");cp.textContent="Copier";cp.onclick=function(){try{navigator.clipboard.writeText(m.t).then(function(){toast("Copié")},function(){toast("Copie impossible")})}catch(e){toast("Copie impossible")}};
  a.appendChild(b);a.appendChild(cp);d.appendChild(a)}
 return d;
}
function render(){
 applyPrefs();renderHist();
 var box=$("msgs");box.innerHTML="";var c=conv();
 if(!c||!c.msgs.length){
  box.innerHTML='<div class="hero"><div class="logo">P</div><h1>Pixel IA</h1><p>Que veux-tu savoir aujourd’hui ?</p><div class="chips"></div></div>';
  ["Explique-moi la photosynthèse simplement","Écris une fonction Python qui trie une liste","Donne-moi 5 idées de repas rapides"].forEach(function(s){
   var b=document.createElement("button");b.className="chip";b.textContent=s;b.onclick=function(){$("in").value=s;send()};box.querySelector(".chips").appendChild(b)});
  return;
 }
 c.msgs.forEach(function(m){box.appendChild(bubble(m))});
 box.scrollTop=box.scrollHeight;
}
function closeAll(){["drawer","models","set","lock","info"].forEach(function(i){$(i).classList.remove("on")});$("ov").classList.remove("on")}
function open(id){closeAll();$(id).classList.add("on");$("ov").classList.add("on")}
function newPage(){stopSpeak();S.cur=null;save();closeAll();render();$("in").focus()}

function renderModels(){
 var l=$("mlist");l.innerHTML="";
 Object.keys(MODELS).forEach(function(k){
  var m=MODELS[k],b=document.createElement("button");b.className="opt"+(S.model===k?" sel":"");
  var lf=left(k),badge="";
  if(m.lim){badge=S.plan==="premium"?'<span class="badge">Premium · '+(PREM[k]-S.tot[k]).toLocaleString("fr-FR")+' restantes</span>':'<span class="badge">'+lf+"/"+m.lim+" gratuites</span>"}
  b.innerHTML="<b><span>"+m.n+"</span>"+badge+"</b><small>"+m.d+"</small>";
  b.onclick=function(){S.model=k;save();closeAll();applyPrefs()};
  l.appendChild(b);
 });
}
function showLock(k){
 var m=MODELS[k];
 $("locktxt").textContent="Tu as utilisé tes "+m.lim+" questions gratuites avec "+m.n+". Passe en Premium (35,90 €) pour des milliers de questions, ou reviens avec Flash qui reste gratuit.";
 open("lock");
}
function upgrade(){S.plan="premium";save();closeAll();applyPrefs();toast("Premium activé (démo) ✨")}

var busy=false;
async function send(){
 var inp=$("in"),txt=inp.value.trim();
 if(!txt||busy)return;
 stopSpeak();var k=S.model,m=MODELS[k];
 if(m.lim&&S.plan!=="premium"&&S.used[k]>=m.lim){showLock(k);return}
 if(m.lim&&S.plan==="premium"&&S.tot[k]>=PREM[k]){toast("Quota Premium atteint pour "+m.n);return}
 if(!conv()){var c={id:"c"+Date.now(),title:txt.slice(0,32),msgs:[]};S.convs.unshift(c);S.cur=c.id}
 var c=conv();
 c.msgs.push({r:"u",t:txt});
 var am={r:"a",t:"",m:k};c.msgs.push(am);
 if(m.lim){if(S.plan==="premium")S.tot[k]++;else S.used[k]++}
 inp.value="";inp.style.height="auto";save();render();
 busy=true;$("send").disabled=true;
 var body=$("msgs").lastChild.querySelector(".body");
 try{
  var sample=window.claude?await claude.use("sample"):null;
  var hist=c.msgs.slice(0,-1).slice(-12).map(function(x){return{role:x.r==="u"?"user":"assistant",content:x.t}});
  while(hist.length&&hist[0].role!=="user")hist.shift();
  hist[0].content="[Consignes : "+m.sys+COMMON+"]\n\n"+hist[0].content;
  var res=!sample?await viaApi(hist,k):await sample(hist,{modelTier:m.tier,cache:false,onText:function(o){am.t=o.text;body.innerHTML=md(o.text);$("msgs").scrollTop=$("msgs").scrollHeight}});
  am.t=res.text||am.t;
 }catch(e){
  if(e&&e.code==="none")am.t="Mode démo : la connexion à l’IA n’est pas disponible dans cette vue. Ouvre la page publiée depuis ton compte Claude pour obtenir de vraies réponses.";
  else if(e&&e.code==="not_granted")am.t="Autorisation refusée. Accepte la demande d’accès pour que Pixel IA puisse répondre.";
  else if(e&&e.code==="rate_limited")am.t="Trop de demandes pour l’instant, réessaie dans un instant.";
  else am.t=(e&&e.text)||"Oups, une erreur est survenue. Réessaie.";
  if(m.lim){if(S.plan==="premium")S.tot[k]=Math.max(0,S.tot[k]-1);else S.used[k]=Math.max(0,S.used[k]-1)}
 }
 busy=false;$("send").disabled=false;save();render();
}

$("burger").onclick=function(){renderHist();open("drawer")};
$("ov").onclick=closeAll;
$("new").onclick=newPage;$("newtop").onclick=newPage;
$("pill").onclick=function(){renderModels();open("models")};
$("openset").onclick=function(){open("set")};
$("setmodel").onclick=function(){renderModels();open("models")};
$("send").onclick=send;
$("in").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey&&window.innerWidth>700){e.preventDefault();send()}});
$("in").addEventListener("input",function(){this.style.height="auto";this.style.height=Math.min(this.scrollHeight,140)+"px"});
document.querySelectorAll("#theme button").forEach(function(b){b.onclick=function(){S.theme=b.dataset.v;save();applyPrefs()}});
document.querySelectorAll("#fs button").forEach(function(b){b.onclick=function(){S.fs=b.dataset.v;save();applyPrefs()}});
$("premium").onclick=showBuy;$("golock").onclick=showBuy;$("closelock").onclick=closeAll;
$("clear").onclick=function(){if(confirm("Effacer toutes les conversations ?")){S.convs=[];S.cur=null;save();closeAll();render()}};
$("resetq").onclick=function(){S.used={think:0,pro:0};save();toast("Questions gratuites réinitialisées");applyPrefs()};

var speaking=null;
function resetBtns(){document.querySelectorAll(".lis").forEach(function(x){x.className="lis";x.textContent="🔊 Écouter"})}
function stopSpeak(){try{speechSynthesis.cancel()}catch(e){}speaking=null;resetBtns()}
function listen(m,btn){
 if(!("speechSynthesis" in window)){toast("Lecture vocale indisponible sur cet appareil");return}
 if(speaking===m){stopSpeak();return}
 stopSpeak();
 var plain=m.t.replace(/```[\s\S]*?```/g," Bloc de code. ").replace(/[*#`_>|]/g,"").replace(/\s+/g," ").trim();
 if(!plain)return;
 var lang=/[éèêàùçôî]|\b(le|la|les|des|est|une|que|et|je|tu|pour)\b/i.test(plain)?"fr-FR":"en-US";
 var v=null,vs=speechSynthesis.getVoices()||[];
 var pool=vs.filter(function(x){return x.lang&&x.lang.toLowerCase().indexOf(lang.slice(0,2).toLowerCase())===0});
 v=pool.find(function(x){return /google|amélie|thomas|audrey|siri|natural/i.test(x.name)})||pool[0]||null;
 var sents=plain.match(/[^.!?;:]+[.!?;:]*\s*/g)||[plain],chunks=[],cur="";
 sents.forEach(function(s){if((cur+s).length>170&&cur){chunks.push(cur);cur=s}else cur+=s});
 if(cur)chunks.push(cur);
 speaking=m;btn.className="lis on";btn.textContent="⏹ Arrêter";
 chunks.forEach(function(t,i){
  var u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=parseFloat(S.rate)||1;if(v)u.voice=v;
  if(i===chunks.length-1)u.onend=function(){if(speaking===m){speaking=null;resetBtns()}};
  u.onerror=function(ev){if(ev.error!=="canceled"&&ev.error!=="interrupted"&&speaking===m){stopSpeak();toast("Lecture impossible ici")}};
  speechSynthesis.speak(u);
 });
}
document.querySelectorAll("#rate button").forEach(function(b){b.onclick=function(){S.rate=b.dataset.v;save();applyPrefs()}});

var VOICES=[],REFS=[];
function loadVoices(){try{VOICES=speechSynthesis.getVoices()||[]}catch(e){}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
function pickVoice(lang){var p=VOICES.filter(function(x){return String(x.lang).replace("_","-").toLowerCase().indexOf(lang.slice(0,2))===0});return p.find(function(x){return x.localService})||p[0]||null}
function listen2(m,btn,nov){
 if(!("speechSynthesis" in window)||typeof SpeechSynthesisUtterance==="undefined"){toast("Voix non prise en charge dans cette vue. Ouvre la page dans Chrome.");return}
 if(speaking===m&&!nov){stopSpeak();return}
 var busy=speechSynthesis.speaking||speechSynthesis.pending;
 if(busy)speechSynthesis.cancel();
 resetBtns();
 var plain=m.t.replace(/```[\s\S]*?```/g," Bloc de code. ").replace(/[*#`_>|]/g,"").replace(/\s+/g," ").trim();
 if(!plain)return;
 var lang=/[éèêàùçôî]|\b(le|la|les|des|est|une|que|et|je|tu|pour)\b/i.test(plain)?"fr-FR":"en-US";
 loadVoices();var v=nov?null:pickVoice(lang);
 var sents=plain.match(/[^.!?;:]+[.!?;:]*\s*/g)||[plain],chunks=[],cur="";
 sents.forEach(function(s){if((cur+s).length>160&&cur){chunks.push(cur);cur=s}else cur+=s});
 if(cur)chunks.push(cur);
 speaking=m;btn.className="lis on";btn.textContent="⏹ Arrêter";
 var started=false;REFS=[];
 var go=function(){
  try{speechSynthesis.resume()}catch(e){}
  chunks.forEach(function(t,i){
   var u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=parseFloat(S.rate)||1;u.volume=1;if(v)u.voice=v;
   u.onstart=function(){started=true};
   if(i===chunks.length-1)u.onend=function(){if(speaking===m){speaking=null;resetBtns()}};
   u.onerror=function(ev){
    if(ev.error==="canceled"||ev.error==="interrupted"||speaking!==m)return;
    if(!nov){speaking=null;try{speechSynthesis.cancel()}catch(e){}setTimeout(function(){listen2(m,btn,true)},150);return}
    stopSpeak();toast("Lecture impossible ("+ev.error+")");
   };
   REFS.push(u);speechSynthesis.speak(u);
  });
 };
 if(busy)setTimeout(go,150);else go();
 setTimeout(function(){if(speaking===m&&!started&&!speechSynthesis.speaking){stopSpeak();toast("Aucune voix détectée. Vérifie le volume et la synthèse vocale du téléphone, ou ouvre la page dans Chrome.")}},3000);
}
